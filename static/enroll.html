<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Enrollment</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f7f9;
      color: #1f2933;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 32px auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .hint {
      margin: 0 0 20px;
      color: #586575;
      font-size: 14px;
    }

    .panel {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      padding: 18px;
      background: #ffffff;
      border: 1px solid #d9dee7;
      border-radius: 8px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    input {
      min-width: 240px;
      flex: 1;
      padding: 11px 12px;
      border: 1px solid #b8c1cc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid #1f2933;
      border-radius: 6px;
      background: #1f2933;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
    }

    button.secondary {
      background: #ffffff;
      color: #1f2933;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111827;
      border: 1px solid #c8d0da;
      border-radius: 8px;
      object-fit: cover;
    }

    canvas {
      display: none;
    }

    .status {
      min-height: 46px;
      padding: 12px;
      background: #f0f3f7;
      border-radius: 6px;
      color: #263241;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.45;
    }

    .ok {
      border-left: 4px solid #16a34a;
    }

    .error {
      border-left: 4px solid #dc2626;
    }

    @media (max-width: 620px) {
      main {
        width: min(100% - 20px, 960px);
        margin: 20px auto;
      }

      button,
      input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Face Enrollment</h1>
    <p class="hint">Nhap owner name, bat camera, chup 3-5 anh de them vao known_faces.</p>

    <section class="panel">
      <div class="controls">
        <input id="ownerName" type="text" placeholder="Owner name, e.g. minh" autocomplete="off" />
        <button id="startButton" type="button">Start Camera</button>
        <button id="captureButton" type="button" class="secondary">Capture & Upload</button>
        <button id="autoButton" type="button" class="secondary">Auto 5 Photos</button>
      </div>

      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>

      <div class="status" id="result">Ready.</div>
    </section>
  </main>

  <script>
    const ownerInput = document.getElementById("ownerName");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const resultBox = document.getElementById("result");
    const startButton = document.getElementById("startButton");
    const captureButton = document.getElementById("captureButton");
    const autoButton = document.getElementById("autoButton");

    const ownerNamePattern = /^[A-Za-z0-9_-]{1,50}$/;

    let stream = null;
    let isUploading = false;

    startButton.addEventListener("click", startCamera);
    captureButton.addEventListener("click", captureAndUpload);
    autoButton.addEventListener("click", autoCapture);

    function setStatus(message, type = "") {
      resultBox.textContent = message;
      resultBox.className = `status ${type}`.trim();
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function getOwnerName() {
      const ownerName = ownerInput.value.trim();

      if (!ownerName) {
        setStatus("Please enter owner name.", "error");
        return null;
      }

      if (!ownerNamePattern.test(ownerName)) {
        setStatus("Owner name chi duoc dung chu, so, dau _ hoac -.", "error");
        return null;
      }

      return ownerName;
    }

    function setButtonsDisabled(disabled) {
      captureButton.disabled = disabled;
      autoButton.disabled = disabled;
      ownerInput.disabled = disabled;
    }

    async function startCamera() {
      try {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();
        setStatus("Camera started.", "ok");
      } catch (error) {
        setStatus(`Cannot start camera: ${error.message}`, "error");
      }
    }

    async function captureBlob() {
      if (!stream) {
        setStatus("Please start camera first.", "error");
        return null;
      }

      if (!video.videoWidth || !video.videoHeight) {
        setStatus("Camera is not ready yet.", "error");
        return null;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.95);
      });
    }

    async function uploadCurrentFrame(ownerName, photoNumber = null) {
      const blob = await captureBlob();

      if (!blob) {
        return false;
      }

      const formData = new FormData();
      formData.append("file", blob, "capture.jpg");

      const label = photoNumber ? `Uploading photo ${photoNumber}...` : "Uploading...";
      setStatus(label);

      const response = await fetch(`/owners/${encodeURIComponent(ownerName)}/images`, {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        const message = data.detail || data.error || "Upload failed.";
        setStatus(message, "error");
        return false;
      }

      setStatus(`Uploaded for ${data.owner}.\nImage: ${data.image}`, "ok");
      return true;
    }

    async function captureAndUpload() {
      const ownerName = getOwnerName();

      if (!ownerName || isUploading) {
        return;
      }

      try {
        isUploading = true;
        setButtonsDisabled(true);
        await uploadCurrentFrame(ownerName);
      } catch (error) {
        setStatus(`Upload failed: ${error.message}`, "error");
      } finally {
        isUploading = false;
        setButtonsDisabled(false);
      }
    }

    async function autoCapture() {
      const ownerName = getOwnerName();

      if (!ownerName || isUploading) {
        return;
      }

      try {
        isUploading = true;
        setButtonsDisabled(true);

        let uploadedCount = 0;

        for (let i = 1; i <= 5; i += 1) {
          setStatus(`Prepare photo ${i}/5...`);
          await sleep(900);

          const uploaded = await uploadCurrentFrame(ownerName, i);

          if (!uploaded) {
            break;
          }

          uploadedCount += 1;
        }

        setStatus(`Auto capture finished. Uploaded ${uploadedCount}/5 photos.`, uploadedCount > 0 ? "ok" : "error");
      } catch (error) {
        setStatus(`Auto capture failed: ${error.message}`, "error");
      } finally {
        isUploading = false;
        setButtonsDisabled(false);
      }
    }
  </script>
</body>
</html>
