<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Enrollment</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <script src="/static/js/enroll.js" defer></script>
</head>
<body>
  <main>
    <h1>Face Enrollment</h1>
    <p class="hint">Nhap owner name, bat camera, chup 3-5 anh de them vao known_faces.</p>

    <section class="panel stack">
      <div class="controls">
        <input id="ownerName" type="text" placeholder="Owner name, e.g. minh" autocomplete="off" />
        <button id="startButton" type="button">Start Camera</button>
        <button id="stopCameraButton" type="button" class="secondary" disabled>Stop Camera</button>
        <button id="captureButton" type="button" class="secondary">Capture & Upload</button>
        <button id="autoButton" type="button" class="secondary">Auto 5 Photos</button>
      </div>

      <div class="camera-frame">
        <video id="video" autoplay playsinline muted></video>
        <div class="face-guide" aria-hidden="true"></div>
      </div>
      <canvas id="canvas"></canvas>

      <div class="status" id="result">Ready.</div>
    </section>
  </main>
</body>
</html>
